# Publica o app no GitHub Pages a cada push na main (ou manualmente pela aba Actions).
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # O site fica em https://<usuario>.github.io/<repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/

      # SPA: o Pages devolve 404.html para rotas como /aluno; uma cópia do index.html carrega o app nelas.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
